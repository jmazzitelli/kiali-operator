- name: Get monitoring role bindings
  vars:
    instance_name: "{{ kiali.instance_name | default('kiali') }}"
  k8s_info:
    api_version: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    namespace: "{{ item }}"
    name: "{{ instance_name }}-monitoring"
  register: monitoring_rolebindings
  with_items: "{{ role_namespaces_to_test | default([ kiali.install_namespace ]) }}"

- name: Assert that monitoring role bindings exist and reference the view ClusterRole
  assert:
    that:
    - item.resources | length == 1
    - item.resources[0].roleRef.kind == 'ClusterRole'
    - item.resources[0].roleRef.name == 'view'
    fail_msg: "Missing or incorrect monitoring RoleBinding"
  with_items: "{{ monitoring_rolebindings.results }}"
