- name: Destroy
  hosts: localhost
  connection: local
  collections:
  - kubernetes.core
  tasks:
  - name: Delete test namespace created during converge
    k8s:
      state: absent
      api_version: v1
      kind: Namespace
      name: kiali-roles-test-ns
    ignore_errors: yes

- name: Include the base destroy play to destroy the kiali install
  import_playbook: ../default/destroy.yml
