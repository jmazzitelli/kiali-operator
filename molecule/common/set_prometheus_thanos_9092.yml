- import_tasks: ../common/wait_for_kiali_cr_changes.yml

- name: "Set Prometheus URL to Thanos tenancy port 9092"
  vars:
    current_kiali_cr: "{{ kiali_cr_list.resources[0] }}"
  set_fact:
    new_kiali_cr: "{{ current_kiali_cr | combine({'spec': {'external_services': {'prometheus': {'url': 'https://thanos-querier.openshift-monitoring.svc.cluster.local:9092'}}}}, recursive=True) }}"

- import_tasks: ../common/set_kiali_cr.yml
